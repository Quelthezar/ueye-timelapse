[project]
name = "ueye-timelapse"
version = "0.1.0"
description = "A small timelapse capture application for IDS uEye cameras"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
video = [
    "opencv-python>=4.8",
]

[project.scripts]
ueye-timelapse = "ueye_timelapse.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ueye_timelapse"]